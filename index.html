<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTopo to CaveRenderPro Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>VTopo → CaveRenderPro Converter</h1>
    <p class="description">Convert VTopo survey files (.tro) to CaveRenderPro XML format for import into CaveRenderPro.</p>

    <div class="card" id="step1">
      <div class="step-header">
        <span class="step-number">1</span>
        <h2>Select Survey File</h2>
      </div>
      <div class="file-input-wrapper">
        <label for="troFile" class="file-label">Choose .tro file</label>
        <input type="file" id="troFile" accept=".tro" onchange="onFileSelected(this)">
        <span id="fileName" class="file-name">No file selected</span>
      </div>
    </div>

    <div class="card" id="step2" style="display:none">
      <div class="step-header">
        <span class="step-number">2</span>
        <h2>Cave Information</h2>
      </div>
      <p class="hint">Detected from file header — edit as needed before converting.</p>
      <div class="form-grid">
        <div class="form-group">
          <label for="caveName">Cave Name</label>
          <input type="text" id="caveName" placeholder="Unknown Cave">
        </div>
        <div class="form-group">
          <label for="caveHöhle">Short Name (Höhle)</label>
          <input type="text" id="caveHöhle" placeholder="Unknown">
        </div>
        <div class="form-group">
          <label for="caveKataster">Kataster ID</label>
          <input type="number" id="caveKataster" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="caveDate">Survey Date</label>
          <input type="date" id="caveDate">
        </div>
      </div>
    </div>

    <div class="card" id="step3" style="display:none">
      <div class="step-header">
        <span class="step-number">3</span>
        <h2>Convert &amp; Download</h2>
      </div>
      <div id="preview" class="preview"></div>
      <div class="action-row">
        <button id="convertBtn" onclick="convertFile()">Convert to CaveRenderPro XML</button>
        <a id="downloadLink" style="display:none" class="download-btn">⬇ Download XML</a>
      </div>
    </div>

    <div id="statusMessage" class="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
